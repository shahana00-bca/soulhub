{% extends 'psychologist/index.html' %}
{% block body %}<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Google Meet Link</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card shadow rounded-4">
                <div class="card-header bg-primary text-white text-center rounded-top-4">
                    <h4>Add Google Meet Link</h4>
                </div>

                <div class="card-body">
                    <form method="POST">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label">Google Meet Link</label>
                            <input type="url" name="link" class="form-control" placeholder="https://meet.google.com/xxx-xxxx-xxx" required>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-success">
                                Add Link
                            </button>
                        </div>
                    </form>
                </div>

                <div class="card-footer text-center">
                    <a href="/myapp/psy_view_link/" class="btn btn-outline-primary btn-sm">
                        View Added Links
                    </a>
                </div>

            </div>

        </div>
    </div>
</div>

</body>
</html>


{% endblock %}
