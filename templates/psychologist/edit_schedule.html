{% extends 'psychologist/index.html' %}
{% block body %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Schedule</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h3 class="mb-4">Edit Slot</h3>
    <div class="card">
        <div class="card-body">
            <form id="editForm" action="/myapp/edit_schedule_post/" method="post">
                <input type="hidden" value="{{ data.id }}" name="id">
                <div class="row">
                    <div class="col-md-4">
                        <label for="date" class="form-label">Date</label>
                        <input id="date" type="date" class="form-control" name="date" value="{{ data.date }}" required>
                    </div>
                    <div class="col-md-4">
                        <label for="time" class="form-label">From Time</label>
                        <input id="time" type="time" class="form-control" name="from_time" value="{{ data.from_time }}" required>
                    </div>
                    <div class="col-md-4">
                        <label for="time" class="form-label">To Time</label>
                        <input id="time" type="time" class="form-control" name="to_time"  value="{{ data.to_time }}" required>
                    </div>

                </div>
                <div class="mt-3">
                    <button type="submit" class="btn btn-success">Update Slot</button>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
{% endblock %}
