{% extends 'psychologist/index.html' %}
{% block body %}
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Schedule Slot</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container">
    <h2 class="mb-4">Add Schedule Slot</h2>
    <form  method="post" action="/myapp/add_schedule_post/">
      <div class="row mb-3">
        <label for="date" class="col-sm-4 col-form-label">Date</label>
        <div class="col-sm-8">
          <input type="date" class="form-control" id="date" name="date" required>
        </div>
      </div>

      <div class="row mb-3">
        <label for="from_time" class="col-sm-4 col-form-label">From Time</label>
        <div class="col-sm-8">
          <input type="time" class="form-control" id="from_time" name="from_time" required>
        </div>
      </div>

      <div class="row mb-3">
        <label for="to_time" class="col-sm-4 col-form-label">To Time</label>
        <div class="col-sm-8">
          <input type="time" class="form-control" id="to_time" name="to_time" required>
        </div>
      </div>



      <div class="row mb-3">
        <div class="offset-sm-4 col-sm-8">
          <button type="submit" class="btn btn-primary">Save Slot</button>
        </div>
      </div>
    </form>
  </div>


</body>
</html>
{% endblock %}
