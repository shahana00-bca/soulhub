<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Change Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
{% for i in messages %}
    <script>alert('{{ i }}')</script>
{% endfor %}

<div class="container mt-5" style="max-width: 450px;">
    <h3 class="text-center mb-4">Change Password</h3>

    <div class="card shadow-sm">
        <div class="card-body">
            <form method="post" action="/myapp/change_password_post/">{% csrf_token %}

                <div class="mb-3">
                    <label>Current Password</label>
                    <input type="password" class="form-control" name='old' id="currentPassword" required>
                </div>

                <div class="mb-3">
                    <label>New Password</label>
                    <input type="password" class="form-control" name='new' id="newPassword" required>
                </div>

                <div class="mb-3">
                    <label>Confirm New Password</label>
                    <input type="password" class="form-control" name="confirm" id="confirmPassword" required>
                </div>

                <div id="errorMsg" class="text-danger mb-3"></div>

                <button type="submit" class="btn btn-primary w-100">
                    Update Password
                </button>
            </form>
        </div>
    </div>
</div>

<script>
function validatePassword() {
    let newPass = document.getElementById("newPassword").value;
    let confirmPass = document.getElementById("confirmPassword").value;
    let error = document.getElementById("errorMsg");

    if (newPass.length < 6) {
        error.innerText = "Password must be at least 6 characters.";
        return false;
    }

    if (newPass !== confirmPass) {
        error.innerText = "New password and confirm password do not match.";
        return false;
    }

    return true;
}
</script>

</body>
</html>
