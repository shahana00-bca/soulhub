{% extends 'admin/index.html' %}
{% block body %}<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Registration Data Table</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet">
  <style>
    .img-thumbnail {
      width: 50px;
      height: 50px;
    }
    .filter-box {
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="container mt-5">
    <h2 class="mb-4">Registered Users</h2>

    <!-- Date Filter Inputs -->

    <table id="registrationTable" class="table table-striped table-bordered">
    <thead>
        <th>Sl No</th>
        <th>Name</th>
        <th>Place</th>
        <th>Phone</th>
        <th>Email</th>

   </thead>
      {%  for i in data %}
        <tr>
            <td>{{ forloop.counter }}</td>
         <td>{{ i.name }}</td>
         <td>{{ i.place }}</td>
         <td>{{ i.phone }}</td>
          <td>{{ i.email }}</td>

        </tr>
      {%  endfor %}

      <tbody>

    </table>
  </div>

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>

  <script>
    // Custom filtering function for date range
    $.fn.dataTable.ext.search.push(function (settings, data, dataIndex) {
      let min = $('#minDate').val();
      let max = $('#maxDate').val();
      let dob = data[3]; // Index of DOB column

      if (!min && !max) return true;

      const date = new Date(dob);
      const minDate = min ? new Date(min) : null;
      const maxDate = max ? new Date(max) : null;

      if (
        (!minDate || date >= minDate) &&
        (!maxDate || date <= maxDate)
      ) {
        return true;
      }
      return false;
    });

    $(document).ready(function () {
      const table = $('#registrationTable').DataTable();

      // Event listeners for date range filtering
      $('#minDate, #maxDate').on('change', function () {
        table.draw();
      });
    });
  </script>
</body>
</html>
{% endblock %}
