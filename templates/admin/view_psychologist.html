<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Approved Psychologists</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet">
  </head>
  <body>
    <div class="container mt-4">
      <h3 class="mb-4">Approved / Accessed Psychologists</h3>

      <div class="row mb-3">
        <div class="col-md-3">
          <label for="statusFilter" class="form-label">Status</label>
          <select id="statusFilter" class="form-select">
            <option value="">All</option>
            <option value="approved">Approved</option>
            <option value="accessed">Accessed</option>
            <option value="pending">Pending</option>
          </select>
        </div>
        <div class="col-md-3">
          <label for="fromDate" class="form-label">From Date</label>
          <input type="date" id="fromDate" class="form-control">
        </div>
        <div class="col-md-3">
          <label for="toDate" class="form-label">To Date</label>
          <input type="date" id="toDate" class="form-control">
        </div>
      </div>

      <div class="card">
        <div class="card-body table-responsive">
          <table id="approvedTable" class="table table-striped table-bordered align-middle text-center" style="width:100%">
            <thead class="table-light">
              <tr>
                <th>#</th>
                <th>Name</th>
                <th>Qualification</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Place</th>
                <th>Experience</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="tbody">
              <!-- rows populated by JS -->
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
    <script>
      // Sample data — replace with server data or fetch via AJAX
      const psychologists = [
        {id:1, name:'Dr. Alice', qualification:'PhD', email:'alice@example.com', phone:'1234567890', place:'City A', experience:'5 yrs', status:'approved', approved_date:'2025-01-10'},
        {id:2, name:'Dr. Bob', qualification:'MSc', email:'bob@example.com', phone:'0987654321', place:'City B', experience:'3 yrs', status:'accessed', approved_date:'2025-02-05'},
      ];

      function renderRows(){
        const tbody = document.getElementById('tbody');
        tbody.innerHTML = '';
        psychologists.forEach((p, i) => {
          const tr = document.createElement('tr');
          tr.dataset.approvedDate = p.approved_date || '';
          tr.innerHTML = `
            <td>${i+1}</td>
            <td>${p.name}</td>
            <td>${p.qualification}</td>
            <td>${p.email}</td>
            <td>${p.phone}</td>
            <td>${p.place}</td>
            <td>${p.experience}</td>
            <td>${p.status === 'approved' ? '<span class="badge bg-success">Approved</span>' : (p.status === 'accessed' ? '<span class="badge bg-info text-dark">Accessed</span>' : '<span class="badge bg-secondary">Pending</span>')}</td>
            <td>
              <a href="#" class="btn btn-sm btn-primary" data-id="${p.id}">View</a>
              ${p.status !== 'approved' ? `<button class="btn btn-sm btn-success ms-1" data-action="approve" data-id="${p.id}">Approve</button>` : `<button class="btn btn-sm btn-danger ms-1" data-action="revoke" data-id="${p.id}">Revoke</button>`}
            </td>
          `;
          tbody.appendChild(tr);
        });
      }

      // DataTables custom filter for status and date
      $.fn.dataTable.ext.search.push(function(settings, data, dataIndex){
        const statusFilter = document.getElementById('statusFilter').value;
        const min = document.getElementById('fromDate').value;
        const max = document.getElementById('toDate').value;

        const row = $('#approvedTable').find('tbody tr').eq(dataIndex);
        const statusText = row.find('td').eq(7).text().trim().toLowerCase();
        const dateStr = row.data('approved-date') || '';

        if(statusFilter && statusFilter !== statusText) return false;

        if((min || max)){
          if(!dateStr) return false;
          const date = new Date(dateStr);
          const minD = min ? new Date(min) : null;
          const maxD = max ? new Date(max) : null;
          if((minD && date < minD) || (maxD && date > maxD)) return false;
        }

        return true;
      });

      $(document).ready(function(){
        renderRows();
        const table = $('#approvedTable').DataTable({ pageLength: 10 });

        $('#statusFilter, #fromDate, #toDate').on('change', function(){ table.draw(); });

        // Action buttons (sample handlers)
        $('#approvedTable').on('click', 'button[data-action]', function(e){
          const id = $(this).data('id');
          const action = $(this).data('action');
          alert(action + ' ID ' + id + ' (UI-only)');
        });
      });
    </script>
  </body>
</html>
