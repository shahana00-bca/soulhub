<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Reply to Complaint</title>
    <!-- Link your existing CSS here -->
    <!-- <link rel="stylesheet" href="/static/css/admin.css"> -->
    <style>
      /* Minimal fallback styles so the page is readable without your CSS */
      .container{max-width:900px;margin:24px auto;padding:0 12px}
      .card{border:1px solid #ddd;border-radius:6px;margin-bottom:16px}
      .card-header{background:#f7f7f7;padding:10px 14px;font-weight:600}
      .card-body{padding:14px}
      .form-control,input,textarea{width:100%;padding:8px;border:1px solid #ccc;border-radius:4px}
      .btn{display:inline-block;padding:8px 12px;border-radius:4px;text-decoration:none;border:1px solid transparent}
      .btn-primary{background:#0d6efd;color:#fff}
      .btn-secondary{background:#6c757d;color:#fff}
      .mb-2{margin-bottom:8px}
      .mb-3{margin-bottom:12px}
    </style>
  </head>
  <body>
    <div class="container">
      <h3>Reply to Complaint</h3>

      <div class="card">
        <div class="card-header">Original Complaint</div>
        <div class="card-body">
          <div class="mb-2"><strong>Date:</strong> <span id="c-date">-</span></div>
          <div class="mb-2"><strong>From:</strong> <span id="c-from">-</span></div>
          <div class="mb-2"><strong>Complaint:</strong></div>
          <div id="c-message" class="border p-3" style="background:#fafafa"></div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">Send Reply</div>
        <div class="card-body">
          <form method="post" action="/myapp/send_reply_post/">{% csrf_token %}
            <input type="hidden" name="id" id="complaint_id" value="{{ data.id }}">

            <div class="mb-3">
              <label for="reply">Reply</label>
              <textarea id="reply" name="reply" rows="6" class="form-control" required></textarea>
            </div>

            <div>
              <button type="submit" class="btn btn-primary">Send Reply</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script>
      // populate fields from URL params: ?id=...&date=...&from_name=...&message=...&subject=...
      (function(){
        const p = new URLSearchParams(location.search);
        const id = p.get('id') || '';
        const date = p.get('date') || '';
        const from_name = p.get('from_name') || p.get('from') || '';
        const message = p.get('message') || '';
        const subject = p.get('subject') || '';

        if(id) document.getElementById('complaint_id').value = id;
        if(date) document.getElementById('c-date').textContent = decodeURIComponent(date);
        if(from_name) document.getElementById('c-from').textContent = decodeURIComponent(from_name);
        if(message) document.getElementById('c-message').textContent = decodeURIComponent(message);
        document.getElementById('subject').value = subject ? ('Re: '+decodeURIComponent(subject)) : 'Re: Your complaint';
      })();
    </script>
  </body>
</html>
