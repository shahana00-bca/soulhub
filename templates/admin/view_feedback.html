{% extends 'admin/index.html' %}
{% block body %}<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>View feedback</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet">
  <style>
    .img-thumbnail {
      width: 50px;
      height: 50px;
    }
    .filter-box {
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="container mt-5">
    <h2 class="mb-4"> Users Feedback</h2>


    <table id="registrationTable" class="table table-striped table-bordered">

        <th>Sl No</th>
        <th>Date</th>
        <th>User Name</th>
        <th>Feedback</th>



        {%  for i in data %}

        <tr>
            <td>{{ forloop.counter }}</td>
            <th>{{ i.date }}</th>
          <th>{{ i.USER.name }}</th>
          <th>{{ i.feedback }}</th>
        </tr>
        {%  endfor %}
      <tbody>

            <!-- Sample Data Rows -->


        </tr>
      </tbody>



        <!-- More rows as needed -->

    </table>
  </div>

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>

  <script>
    // Custom filtering function for date range
    $.fn.dataTable.ext.search.push(function (settings, data, dataIndex) {
      let min = $('#minDate').val();
      let max = $('#maxDate').val();
      let dob = data[3]; // Index of DOB column

      if (!min && !max) return true;

      const date = new Date(dob);
      const minDate = min ? new Date(min) : null;
      const maxDate = max ? new Date(max) : null;

      if (
        (!minDate || date >= minDate) &&
        (!maxDate || date <= maxDate)
      ) {
        return true;
      }
      return false;
    });

    $(document).ready(function () {
      const table = $('#registrationTable').DataTable();

      // Event listeners for date range filtering
      $('#minDate, #maxDate').on('change', function () {
        table.draw();
      });
    });
  </script>
</body>
</html>
{% endblock %}
